spring:
  application:
    name: salome-core
  main:
    web-application-type: ${SALOME_WEB_APPLICATION_TYPE:servlet}
  profiles:
    default: local
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  servlet:
    multipart:
      max-file-size: ${SALOME_TORRE_FOTOS_MAX:10MB}
      # Uma avaria pode subir várias fotos (avaria + nota fiscal) num único request.
      max-request-size: ${SALOME_TORRE_FOTOS_REQ_MAX:80MB}

server:
  port: ${SALOME_SERVER_PORT:8787}

salome:
  legacy:
    datasource:
      enabled: ${SALOME_LEGACY_DB_ENABLED:false}
      url: ${SALOME_LEGACY_DB_URL:}
      username: ${SALOME_LEGACY_DB_USERNAME:}
      password: ${SALOME_LEGACY_DB_PASSWORD:}
      read-only: true
  financeiro:
    fluxo-caixa:
      # Previsão "A receber (faturado)": exclui as faturas em carteira DESCONTADA (dinheiro já
      # antecipado no banco). Coluna do legado = fatura.tipoCarteira (String), valores "Simples" /
      # "Descontada" (NULL nas faturas antigas). Confirmado no fonte legado (FaturaData/FaturaTable).
      # Ativo por padrão; para desligar/ajustar, sobrescrever pelas envs. Múltiplos valores: vírgula.
      carteira-coluna: ${SALOME_FIN_CARTEIRA_COLUNA:tipoCarteira}
      carteira-descontada-valores: ${SALOME_FIN_CARTEIRA_DESCONTADA:Descontada}
    auth:
      # Login por formulário da própria aplicação (substitui o Basic Auth do nginx).
      # DESLIGADO por padrão: enquanto false, tudo fica liberado (controle no nginx).
      # Ao ligar, cadastrar os usuários abaixo (senha em hash BCrypt, recomendado, ou texto puro).
      enabled: ${SALOME_FIN_AUTH_ENABLED:false}
      # users:
      #   - username: salome
      #     password: "$2a$10$COLOQUE_O_HASH_BCRYPT_AQUI"
      #     roles: [USER]
  manifesto:
    export:
      enabled: ${SALOME_MANIFESTO_EXPORT_ENABLED:false}
      cron: ${SALOME_MANIFESTO_EXPORT_CRON:0 */15 * * * *}
      spreadsheet-id: ${SALOME_MANIFESTO_EXPORT_SPREADSHEET_ID:}
      credentials-path: ${SALOME_MANIFESTO_EXPORT_CREDENTIALS_PATH:}
      filial-destino-id: ${SALOME_MANIFESTO_EXPORT_FILIAL_DESTINO_ID:}
      batch-size: ${SALOME_MANIFESTO_EXPORT_BATCH_SIZE:500}
      data-corte: ${SALOME_MANIFESTO_EXPORT_DATA_CORTE:2026-05-01}
  torre:
    enabled: ${SALOME_TORRE_ENABLED:false}
    sync:
      cron: ${SALOME_TORRE_SYNC_CRON:0 */5 * * * *}
    jwt:
      secret: ${SALOME_TORRE_JWT_SECRET:}
      expiration-minutes: ${SALOME_TORRE_JWT_EXP_MIN:720}
    fotos:
      dir: ${SALOME_TORRE_FOTOS_DIR:./dados/torre/fotos}
    mapa:
      # Mapa do armazém: janela (baixas de N dias atrás p/ frente) e cache curto
      # por filial, p/ não multiplicar as consultas pesadas no legado.
      dias-corte: ${SALOME_TORRE_MAPA_DIAS_CORTE:30}
      cache-segundos: ${SALOME_TORRE_MAPA_CACHE_SEGUNDOS:25}
    aguardando:
      # Veículos aguardando descarga (transferências): piso fixo = virada de produção.
      # Baixados a partir desta data ficam no painel até a descarga ser registrada na
      # Torre; baixas anteriores (backlog do legado) são ignoradas. Coletas usam só o dia.
      data-inicio: ${SALOME_TORRE_AGUARDANDO_DATA_INICIO:2026-07-01}
    datasource:
      url: ${SALOME_TORRE_DB_URL:}
      username: ${SALOME_TORRE_DB_USERNAME:}
      password: ${SALOME_TORRE_DB_PASSWORD:}
  hub-crm:
    enabled: ${SALOME_HUB_CRM_ENABLED:false}
    polling-enabled: ${SALOME_HUB_CRM_POLLING_ENABLED:false}
    polling-delay-ms: ${SALOME_HUB_CRM_POLLING_DELAY_MS:30000}
    initial-cutoff-client-id: ${SALOME_HUB_CRM_CLIENT_CUTOFF:32001}
    pilot-size: ${SALOME_HUB_CRM_PILOT_SIZE:10}
    public-base-url: ${SALOME_HUB_CRM_PUBLIC_BASE_URL:}
    media-signing-key: ${SALOME_HUB_CRM_MEDIA_SIGNING_KEY:}
    media-url-ttl-minutes: ${SALOME_HUB_CRM_MEDIA_TTL_MINUTES:60}
    datasource:
      url: ${SALOME_HUB_CRM_DB_URL:}
      username: ${SALOME_HUB_CRM_DB_USERNAME:}
      password: ${SALOME_HUB_CRM_DB_PASSWORD:}
    arpa:
      base-url: ${SALOME_HUB_CRM_ARPA_URL:https://suite.arpacore.com.br}
      api-key: ${SALOME_HUB_CRM_ARPA_API_KEY:}
      pipe-id: ${SALOME_HUB_CRM_PIPE_ID:304805}
      carteira-stage-id: ${SALOME_HUB_CRM_CARTEIRA_STAGE_ID:320394}
      proposta-stage-id: ${SALOME_HUB_CRM_PROPOSTA_STAGE_ID:320618}
      fernanda-user-id: ${SALOME_HUB_CRM_FERNANDA_USER_ID:303711}
      jaci-user-id: ${SALOME_HUB_CRM_JACI_USER_ID:303709}
      cnpj-customfield-id: ${SALOME_HUB_CRM_CNPJ_FIELD_ID:320014}
      cidade-customfield-id: ${SALOME_HUB_CRM_CIDADE_FIELD_ID:320015}
      estado-customfield-id: ${SALOME_HUB_CRM_ESTADO_FIELD_ID:320016}
      segmento-customfield-id: ${SALOME_HUB_CRM_SEGMENTO_FIELD_ID:320013}
      base-cotacao-customfield-id: ${SALOME_HUB_CRM_BASE_COTACAO_FIELD_ID:320209}
      rota-customfield-id: ${SALOME_HUB_CRM_ROTA_FIELD_ID:320206}
      tipo-carga-customfield-id: ${SALOME_HUB_CRM_TIPO_CARGA_FIELD_ID:320208}
      volume-customfield-id: ${SALOME_HUB_CRM_VOLUME_FIELD_ID:320207}
